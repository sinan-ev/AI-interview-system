databases:
  - name: ai-interview-db
    databaseName: ai_interview_db
    user: ai_interview_user
    plan: free
    region: oregon

services:
  # ──────────────────────────────────────────────
  # 1.  FastAPI Backend (Web Service)
  # ──────────────────────────────────────────────
  - type: web
    name: ai-interview-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: APP_NAME
        value: "AI Interview & Assessment Platform"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: STT_PROVIDER
        value: mock
      - key: STT_MODEL
        value: whisper-1
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: RATE_LIMIT
        value: "100/minute"
      - key: AUTH_RATE_LIMIT
        value: "5/minute"
      - key: INTERVIEW_RATE_LIMIT
        value: "10/minute"
      - key: ALLOWED_ORIGINS
        value: '["https://ai-interview-frontend.onrender.com"]'
    healthCheckPath: /api/v1/health

  # ──────────────────────────────────────────────
  # 2.  Celery Worker (Background Worker)
  # FIX: Docker runtime uses dockerCommand, not startCommand
  # ──────────────────────────────────────────────
  - type: worker
    name: ai-interview-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    dockerCommand: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2 -Q evaluation_queue,speech_queue,rag_queue,feedback_queue,celery
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ai-interview-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: ai-interview-backend
          type: web
          envVarKey: SECRET_KEY
      - key: JWT_SECRET
        fromService:
          name: ai-interview-backend
          type: web
          envVarKey: JWT_SECRET
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: mock

  # ──────────────────────────────────────────────
  # 3.  React Frontend (Static Site)
  # FIX: Static sites cannot have a region field
  # ──────────────────────────────────────────────
  - type: web
    name: ai-interview-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-interview-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ──────────────────────────────────────────────
  # 4.  Redis (In-memory DB / Broker)
  # FIX: Redis must specify ipAllowList
  # ──────────────────────────────────────────────
  - type: redis
    name: ai-interview-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
